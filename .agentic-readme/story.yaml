version: '1.0'
repo_name: Agentic-ReadMe-Creator
target_audience: Developers shipping a repo, plus the recruiters and students who
  read it
hook: Writes your README from your code, then fails the build if the two ever disagree.
problem: Traditional workflows in this domain suffer from opaque estimates, unverified
  assumptions, and documentation that drifts out of sync as code and dependencies
  evolve.
solution: 'Agentic-ReadMe-Creator: A verified, media-rich README pipeline grounded
  in real project runs. Every badge and number on this page is checked against facts.json,
  produced from the project''s own code and test runs.'
key_claims:
- claim: Automated test suite with 53 passing tests verifying core system invariants.
  evidence_file: tests
  metrics:
    test_count: 53
  verified: true
- claim: 3869 lines of code in the project source.
  evidence_file: src/
  metrics:
    loc: 3869
  verified: true
- claim: Open source distribution under the MIT license.
  evidence_file: LICENSE
  metrics:
    license: MIT
  verified: true
- claim: Claude Code and Claude Agent SDK skill specification.
  evidence_file: skills/agentic-readme/SKILL.md
  metrics:
    skill: agentic-readme
  verified: true
- claim: Model Context Protocol (MCP) server configuration.
  evidence_file: integrations/mcp/mcp.json
  metrics:
    protocol: '2024-11-05'
  verified: true
- claim: OpenAI Function Calling and Custom GPT Action schemas.
  evidence_file: integrations/gpt/openai_tools.json
  metrics:
    tools_schema: 5
  verified: true
architecture_nodes:
- id: entrypoint
  label: CLI / MCP / Skill
  role: entrypoint
  source_file: src/agentic_readme/cli.py
  technologies: []
- id: ground
  label: 'Ground: facts.json'
  role: pipeline_stage
  source_file: src/agentic_readme/ground
  technologies: []
- id: produce
  label: 'Produce: docs & media'
  role: pipeline_stage
  source_file: src/agentic_readme/produce
  technologies: []
- id: verify
  label: 'Verify: claim audit'
  role: pipeline_stage
  source_file: src/agentic_readme/verify
  technologies: []
quickstart_commands:
- pipx install git+https://github.com/Chirudeva-Reddy/Agentic-ReadMe-Creator.git
- agentic-readme run path/to/your-project
deliberate_omissions:
- 'No unverified claims: every figure is mechanically checked against executable outputs
  in facts.json'
- 'No synthetic or staged mock runs: visual assets reflect genuine project execution'
- No relative <video> tags in README that fail to render on GitHub
- No marketing buzzwords or generic template greetings
evidence_summary: Every figure above is verified against source code and execution
  logs in facts.json
created_at: '2026-09-26T09:25:28.949332+00:00'
