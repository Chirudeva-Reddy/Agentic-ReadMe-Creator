version: '1.0'
repo_name: Agentic-ReadMe-Creator
target_audience: Developers, ML engineers, and technical evaluators
hook: Tired of opaque estimates and manual bottlenecks in a verified, media-rich readme
  pipeline grounded in real project runs?
problem: Traditional workflows in this domain suffer from opaque estimates, unverified
  assumptions, and documentation that drifts out of sync as code and dependencies
  evolve.
solution: Agentic-ReadMe-Creator provides a verified, media-rich readme pipeline grounded
  in real project runs, grounding system execution and performance in deterministic
  data and verified automated test invariants.
key_claims:
- claim: Automated test suite with 46 passing tests verifying core system invariants.
  evidence_file: tests
  metrics:
    test_count: 46
  verified: true
- claim: Modular architecture spanning 4991 lines of code across pipeline stages.
  evidence_file: src/
  metrics:
    loc: 4991
  verified: true
- claim: Open source distribution under the MIT license.
  evidence_file: LICENSE
  metrics:
    license: MIT
  verified: true
- claim: Claude Code and Claude Agent SDK skill specification.
  evidence_file: skills/agentic-readme/SKILL.md
  metrics:
    skill: agentic-readme
  verified: true
- claim: Model Context Protocol (MCP) server configuration.
  evidence_file: mcp.json
  metrics:
    protocol: '2024-11-05'
  verified: true
- claim: OpenAI Function Calling and Custom GPT Action schemas.
  evidence_file: integrations/gpt/openai_tools.json
  metrics:
    tools_schema: 5
  verified: true
architecture_nodes:
- id: entrypoint
  label: CLI / Entrypoint (cli.py)
  role: entrypoint
  source_file: src/agentic_readme/cli.py
  technologies: []
- id: integrations
  label: Integrations Module
  role: pipeline_stage
  source_file: integrations
  technologies: []
- id: skills
  label: Skills Module
  role: pipeline_stage
  source_file: skills
  technologies: []
- id: src
  label: Src Module
  role: pipeline_stage
  source_file: src
  technologies: []
- id: agentic_readme
  label: Agentic Readme Module
  role: pipeline_stage
  source_file: src/agentic_readme
  technologies: []
quickstart_commands:
- git clone https://github.com/Chirudeva-Reddy/Agentic-ReadMe-Creator.git && cd Agentic-ReadMe-Creator
- pip install -e .
- pytest
- python3 src/agentic_readme/cli.py
deliberate_omissions:
- 'No unverified claims: every figure is mechanically checked against executable outputs
  in facts.json'
- 'No synthetic or staged mock runs: visual assets reflect genuine project execution'
- No relative <video> tags in README that fail to render on GitHub
- No marketing buzzwords or generic template greetings
evidence_summary: Every figure above is verified against source code and execution
  logs in facts.json
