version: '1.0'
repo_name: habit-streak
target_audience: Developers, ML engineers, and technical evaluators
hook: Track daily habits and see your longest streak.
problem: Traditional workflows in this domain suffer from opaque estimates, unverified
  assumptions, and documentation that drifts out of sync as code and dependencies
  evolve.
solution: 'habit-streak: Track daily habits and see your longest streak. Every badge
  and number on this page is checked against facts.json, produced from the project''s
  own code and test runs.'
key_claims:
- claim: Automated test suite with 2 passing tests verifying core system invariants.
  evidence_file: .
  metrics:
    test_count: 2
  verified: true
- claim: Open source distribution under the MIT license.
  evidence_file: LICENSE
  metrics:
    license: MIT
  verified: true
architecture_nodes:
- id: entrypoint
  label: CLI / Entrypoint (index.js)
  role: entrypoint
  source_file: index.js
  technologies: []
quickstart_commands:
- git clone <repo-url> && cd habit-streak
- npm install
- npm test
- npm start
deliberate_omissions:
- 'No unverified claims: every figure is mechanically checked against executable outputs
  in facts.json'
- 'No invented numbers: every badge and metric comes from facts.json'
- No relative <video> tags in README that fail to render on GitHub
- No marketing buzzwords or generic template greetings
evidence_summary: Every figure above is verified against source code and execution
  logs in facts.json
