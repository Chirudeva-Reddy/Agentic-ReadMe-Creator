version: '1.0'
repo_name: csv-dedupe
target_audience: Developers, ML engineers, and technical evaluators
hook: Your customer export lists Ana three times.
problem: Traditional workflows in this domain suffer from opaque estimates, unverified
  assumptions, and documentation that drifts out of sync as code and dependencies
  evolve.
solution: 'csv-dedupe: Removes duplicate rows from CSV exports, optionally matching
  on one column.'
key_claims:
- claim: Automated test suite with 4 passing tests verifying core system invariants.
  evidence_file: tests
  metrics:
    test_count: 4
  verified: true
- claim: 60 lines of code in the project source.
  evidence_file: .
  metrics:
    loc: 60
  verified: true
- claim: Open source distribution under the MIT license.
  evidence_file: LICENSE
  metrics:
    license: MIT
  verified: true
architecture_nodes:
- id: entrypoint
  label: CLI / Entrypoint (cli.py)
  role: entrypoint
  source_file: cli.py
  technologies: []
- id: data
  label: Data Files
  role: storage
  source_file: data
  technologies: []
quickstart_commands:
- git clone <repo-url> && cd csv-dedupe
- pip install -e .
- pytest
- python3 cli.py
deliberate_omissions:
- 'No unverified claims: every figure is mechanically checked against executable outputs
  in facts.json'
- 'No invented numbers: every badge and metric comes from facts.json'
- No relative <video> tags in README that fail to render on GitHub
- No marketing buzzwords or generic template greetings
evidence_summary: Every figure above is verified against source code and execution
  logs in facts.json
