[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-readme-creator"
version = "0.1.0"
description = "A verified, media-rich README pipeline grounded in real project runs"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Agentic ReadMe Creator Contributors" }
]
license = { text = "MIT" }
keywords = ["readme", "agentic", "documentation", "verification", "excalidraw", "vhs", "brag", "langchain", "langgraph", "langsmith"]
dependencies = [
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "jinja2>=3.1.3",
]

[project.optional-dependencies]
# LangGraph pipeline, LangChain tools/agent/chain, LangSmith tracing and evals (src/agentic_readme/orchestrate/)
langchain = [
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-anthropic>=1.7.6",  # Claude Opus 5.5 request handling
    "langgraph>=1.0",
    "langsmith>=0.4",
]
dev = [
    "agentic-readme-creator[langchain]",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
agentic-readme = "agentic_readme.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
